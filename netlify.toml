[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Ejecuta la sincronización una vez al día (13:00 UTC / 8:00 AM UTC-5)
[functions."scheduled-sync"]
  schedule = "0 13 * * *"

# Redirige llamadas /api/* a las funciones serverless correspondientes
[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200

[[redirects]]
  from = "/api/sync-background"
  to = "/.netlify/functions/sync-background"
  status = 200

[[redirects]]
  from = "/api/telegram-webhook"
  to = "/.netlify/functions/telegram-webhook"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
